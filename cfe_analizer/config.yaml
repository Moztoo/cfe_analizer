name: "CFE Analizer"
description: "Dashboard interactivo para auditar y analizar el consumo eléctrico de CFE (CFDI 4.0). Incluye desglose por escalón (Básico, Intermedio, Excedente), monitor de riesgo DAC, simulador de ahorro e ingesta automática por webhook desde Gmail."
version: "1.2.0"
slug: "cfe_analizer"
url: "https://github.com/Moztoo/cfe_analizer"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8050
ports:
  8050/tcp: 8050
ports_description:
  8050/tcp: "Puerto HTTP para webhook / API de Google Apps Script"
panel_icon: "mdi:lightning-bolt-circle"
panel_title: "CFE Analizer"
map:
  - share:rw
options:
  input_dir: "/share/cfe_analizer/input"
  api_token: ""
  dac_limite_anual_kwh: 3000
schema:
  input_dir: str
  api_token: password?
  dac_limite_anual_kwh: int?
